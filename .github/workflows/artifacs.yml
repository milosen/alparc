name: Artefacts Workflow

on: [push]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: generate stream dataset
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
          cd publication
          uv run ./generate_all_datasets.sh
          tar -czf results.tar.gz results/*
          uv run python stats.py
      - name: Archive Latest Default Dataset
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            publication/results.tar.gz
