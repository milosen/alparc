[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alparc"
version = "0.1.0"
description = "Artificial languages with phonological, acoustic, and rhythmicity controls"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm",
    "pyyaml",
    "ipykernel>=6.31.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "matplotlib>=3.9.4",
    "pingouin>=0.5.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/alparc"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
